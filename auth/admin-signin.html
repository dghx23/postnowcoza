<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PostNow Administrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0f; color: #e8e8ed; line-height: 1.6; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .signin-container { width: 100%; max-width: 400px; padding: 24px; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #f59e0b, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .back-link { font-size: 13px; color: #f59e0b; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #fcd34d; }
        .signin-content { display: flex; flex-direction: column; gap: 32px; }
        .signin-header { display: flex; flex-direction: column; gap: 8px; }
        .signin-header h1 { font-size: 28px; font-weight: 800; color: #e8e8ed; }
        .signin-header p { font-size: 14px; color: #9ca3af; }
        .security-note { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 12px 16px; font-size: 12px; color: #fca5a5; display: flex; align-items: center; gap: 8px; }
        .signin-form { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 13px; font-weight: 600; color: #e8e8ed; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #e8e8ed; font-size: 14px; font-family: inherit; transition: all 0.2s; }
        .form-input::placeholder { color: #6b7280; }
        .form-input:focus { outline: none; background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
        .form-actions { display: flex; flex-direction: column; gap: 12px; }
        .signin-button { padding: 12px 16px; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .signin-button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .signin-button:active { transform: translateY(0); }
        .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .checkbox-group { display: flex; align-items: center; gap: 6px; }
        .checkbox-group input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: #f59e0b; }
        .checkbox-group label { cursor: pointer; color: #9ca3af; }
        .form-options a { color: #f59e0b; text-decoration: none; transition: color 0.2s; }
        .form-options a:hover { color: #fcd34d; }
        .signin-footer { display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center; font-size: 12px; color: #6b7280; }
        .footer-compliance { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
        .footer-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .footer-links a { color: #f59e0b; text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: #fcd34d; }
        @media (max-width: 480px) { .signin-container { max-width: 100%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; } .signin-header h1 { font-size: 24px; } .form-options { flex-direction: column; gap: 12px; align-items: flex-start; } }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="nav-top">
            <div class="logo">PostNow</div>
            <a href="#" class="back-link">← Back to site</a>
        </div>
        <div class="signin-content">
            <div class="signin-header">
                <h1>Administrator Access</h1>
                <p>Platform management and system configuration</p>
            </div>
            <div class="security-note">
                <span>🔐</span>
                <span>Restricted access. Audit trail enabled.</span>
            </div>
            <form class="signin-form">
                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <input type="email" class="form-input" placeholder="admin@company.co.za" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="signin-button">Sign In</button>
                </div>
                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#">Forgot password?</a>
                </div>
            </form>
        </div>
        <div class="signin-footer">
            <div class="footer-compliance">
                <span>POPIA-first</span>
                <span>·</span>
                <span>Access-controlled</span>
                <span>·</span>
                <span>Audited</span>
            </div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Security</a>
            </div>
        </div>
    </div>
</body>
</html>
